name: QtCore 6.11.1 bounded compatibility proof

on:
  push:
    branches: [codex/qtcore-cloud-proof-20261025]
    paths:
      - .github/workflows/qtcore-cloud-proof.yml
      - tools/qtcore-cloud-proof/**

permissions:
  contents: read

concurrency:
  group: qtcore-cloud-proof-20261025
  cancel-in-progress: false

jobs:
  core:
    if: >-
      github.repository == 'thetotaladdiction-arch/stellar-blade-control-panel' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/qtcore-cloud-proof-20261025'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_AUTOGEN_PARALLEL: '2'
      VSCMD_SKIP_SENDTELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read only this proof package
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/qtcore-cloud-proof.yml
            /tools/qtcore-cloud-proof/
      - name: Build only Core and verify file evidence
        id: proof
        shell: pwsh
        run: python -I -B tools/qtcore-cloud-proof/build_verify.py --cloud-build --compiler-policy compatible-14.51
      - name: Retain bounded evidence and corresponding source
        if: ${{ always() && steps.proof.outputs.artifact_dir != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qtcore-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.proof.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
          overwrite: false
